# One command to run everything: docker compose up --build
# App: http://localhost:8080
services:
  mongo:
    image: mongo:7
    # Single-node replica set: needed for multi-document transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then just reports status.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  server:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/taskboard?replicaSet=rs0
      CLIENT_URL: http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-this-long-random-secret}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mongo-data:
